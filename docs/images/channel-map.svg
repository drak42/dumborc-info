<rect x="450" y="296" width="240" height="26" rx="5" fill="#f6f6f6"/><text x="570" y="314.0" text-anchor="middle" font-size="13" fill="#444">Gyro gain (default)</text>
<rect x="70" y="328" width="80" height="26" rx="5" fill="#e07b39"/><text x="110" y="346.0" text-anchor="middle" font-size="13" fill="#fff">CH9</text>
<rect x="180" y="328" width="240" height="26" rx="5" fill="#eeeeee"/><text x="300" y="346.0" text-anchor="middle" font-size="13" fill="#222">Key K-9</text>
<rect x="450" y="328" width="240" height="26" rx="5" fill="#f6f6f6"/><text x="570" y="346.0" text-anchor="middle" font-size="13" fill="#444">Lights / accessories</text>
<rect x="70" y="360" width="80" height="26" rx="5" fill="#e07b39"/><text x="110" y="378.0" text-anchor="middle" font-size="13" fill="#fff">CH10</text>
<rect x="180" y="360" width="240" height="26" rx="5" fill="#eeeeee"/><text x="300" y="378.0" text-anchor="middle" font-size="13" fill="#222">Key K-10</text>
<rect x="450" y="360" width="240" height="26" rx="5" fill="#f6f6f6"/><text x="570" y="378.0" text-anchor="middle" font-size="13" fill="#444">Wiper (servo swing)</text>
<text x="380" y="414" text-anchor="middle" font-size="12" fill="#555">Keys can be latching, momentary, 3-step or 4-step · any control can be moved with Remap</text>
</svg>
