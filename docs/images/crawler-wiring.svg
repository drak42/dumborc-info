<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="300" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Example crawler wiring</text>
<rect x="300" y="120" width="160" height="110" rx="8" fill="#2b2b2b"/><text x="380" y="171.5" text-anchor="middle" font-size="14" fill="#fff">Receiver</text><text x="380" y="188.5" text-anchor="middle" font-size="14" fill="#fff">P10FG</text>
<rect x="20" y="56" width="220" height="28" rx="5" fill="#eeeeee"/><text x="130" y="75.0" text-anchor="middle" font-size="12" fill="#222">Front steering servo</text>
<line x1="240" y1="70" x2="300" y2="130" stroke="#e07b39" stroke-width="2"/>
<text x="270" y="66" text-anchor="middle" font-size="11" fill="#e07b39" font-weight="bold">CH1</text>
<rect x="20" y="96" width="220" height="28" rx="5" fill="#eeeeee"/><text x="130" y="115.0" text-anchor="middle" font-size="12" fill="#222">ESC</text>
<line x1="240" y1="110" x2="300" y2="130" stroke="#e07b39" stroke-width="2"/>
<text x="270" y="106" text-anchor="middle" font-size="11" fill="#e07b39" font-weight="bold">CH2</text>
<rect x="20" y="136" width="220" height="28" rx="5" fill="#eeeeee"/><text x="130" y="155.0" text-anchor="middle" font-size="12" fill="#222">Winch controller</text>
<line x1="240" y1="150" x2="300" y2="150" stroke="#e07b39" stroke-width="2"/>
<text x="270" y="146" text-anchor="middle" font-size="11" fill="#e07b39" font-weight="bold">CH3</text>
<rect x="20" y="176" width="220" height="28" rx="5" fill="#eeeeee"/><text x="130" y="195.0" text-anchor="middle" font-size="12" fill="#222">Rear steering servo (4WS)</text>
<line x1="240" y1="190" x2="300" y2="190" stroke="#e07b39" stroke-width="2"/>
<text x="270" y="186" text-anchor="middle" font-size="11" fill="#e07b39" font-weight="bold">CH4</text>
<rect x="20" y="216" width="220" height="28" rx="5" fill="#eeeeee"/><text x="130" y="235.0" text-anchor="middle" font-size="12" fill="#222">Main battery (telemetry)</text>
<line x1="240" y1="230" x2="300" y2="220" stroke="#e07b39" stroke-width="2"/>
<text x="270" y="226" text-anchor="middle" font-size="11" fill="#e07b39" font-weight="bold">B+/B–</text>
<rect x="520" y="76" width="220" height="28" rx="5" fill="#eeeeee"/><text x="630" y="95.0" text-anchor="middle" font-size="12" fill="#222">Lights / locker</text>
<line x1="460" y1="130" x2="520" y2="90" stroke="#1a5fb4" stroke-width="2"/>
<text x="490" y="86" text-anchor="middle" font-size="11" fill="#1a5fb4" font-weight="bold">CH7</text>
<rect x="520" y="116" width="220" height="28" rx="5" fill="#eeeeee"/><text x="630" y="135.0" text-anchor="middle" font-size="12" fill="#222">Gyro gain (from radio)</text>
<line x1="460" y1="130" x2="520" y2="130" stroke="#1a5fb4" stroke-width="2"/>
<text x="490" y="126" text-anchor="middle" font-size="11" fill="#1a5fb4" font-weight="bold">CH8</text>
<rect x="520" y="156" width="220" height="28" rx="5" fill="#eeeeee"/><text x="630" y="175.0" text-anchor="middle" font-size="12" fill="#222">Light kit</text>
<line x1="460" y1="170" x2="520" y2="170" stroke="#1a5fb4" stroke-width="2"/>
<text x="490" y="166" text-anchor="middle" font-size="11" fill="#1a5fb4" font-weight="bold">CH9</text>
<rect x="520" y="196" width="220" height="28" rx="5" fill="#eeeeee"/><text x="630" y="215.0" text-anchor="middle" font-size="12" fill="#222">Wiper servo</text>
<line x1="460" y1="210" x2="520" y2="210" stroke="#1a5fb4" stroke-width="2"/>
<text x="490" y="206" text-anchor="middle" font-size="11" fill="#1a5fb4" font-weight="bold">CH10</text>
<text x="380" y="285" text-anchor="middle" font-size="12" fill="#555">Example layout. 4WS is fixed to CH4; servo swing (wiper) defaults to CH10; gyro gain defaults to CH8.</text>
</svg>
